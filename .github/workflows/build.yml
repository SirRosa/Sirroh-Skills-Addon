name: Build Sirroh Skills [Addon]
on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache Valheim dedicated server assemblies
        uses: actions/cache@v4
        id: valheim
        with:
          path: ${{ runner.temp }}/valheim/valheim_server_Data/Managed
          key: valheim-target-1.0.21-dedicated-refs-v1
      - uses: CyberAndrii/setup-steamcmd@v1
        if: steps.valheim.outputs.cache-hit != 'true'
      - name: Download game references
        if: steps.valheim.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/valheim"
          for i in 1 2 3; do
            if steamcmd +force_install_dir "$RUNNER_TEMP/valheim" +login anonymous +app_update 896660 validate +quit &&
              test -f "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/assembly_valheim.dll"; then break; fi
            sleep 5
          done
          test -f "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/assembly_valheim.dll"
      - name: Download BepInEx and Jotunn references
        run: |
          set -euo pipefail
          mkdir -p .ci-deps "$RUNNER_TEMP/bep" "$RUNNER_TEMP/jotunn"
          curl -fL --retry 3 -o "$RUNNER_TEMP/bep.zip" 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2351/'
          unzip -q "$RUNNER_TEMP/bep.zip" -d "$RUNNER_TEMP/bep"
          curl -fL --retry 3 -o "$RUNNER_TEMP/jotunn.zip" 'https://thunderstore.io/package/download/ValheimModding/Jotunn/2.30.2/'
          python3 - "$RUNNER_TEMP/jotunn.zip" "$RUNNER_TEMP/jotunn" <<'PY'
          import pathlib,sys,zipfile,shutil
          root=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as arc:
              for item in arc.infolist():
                  parts=pathlib.PurePosixPath(item.filename.replace(chr(92), '/'))
                  if parts.is_absolute() or '..' in parts.parts: raise ValueError(item.filename)
                  target=root.joinpath(*parts.parts)
                  if item.is_dir(): target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with arc.open(item) as reader,target.open('wb') as writer:
                          shutil.copyfileobj(reader,writer)
          PY
          for item in BepInEx.dll 0Harmony.dll Mono.Cecil.dll Jotunn.dll; do
            src=$(find "$RUNNER_TEMP/bep" "$RUNNER_TEMP/jotunn" -name "$item" -print -quit)
            test -n "$src"
            cp "$src" ".ci-deps/$item"
          done
          for item in assembly_valheim.dll assembly_utils.dll assembly_guiutils.dll UnityEngine.CoreModule.dll UnityEngine.dll UnityEngine.UI.dll UnityEngine.PhysicsModule.dll UnityEngine.ImageConversionModule.dll UnityEngine.UIModule.dll Unity.TextMeshPro.dll; do
            cp "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/$item" ".ci-deps/$item"
          done
      - name: Inspect target Valheim 1.0.21 APIs using current Steam server references
        run: dotnet run --project tools/ApiProbe.csproj -c Release -- .ci-deps/assembly_valheim.dll .ci-deps/BepInEx.dll
      - name: Verify isolation, migration and no duplicate stat writes
        run: python3 tools/verify_contracts.py
      - name: Verify complete Blacksmithing Polish UI and head-hunter visibility
        run: python3 tools/verify_progress_localization.py
      - name: Verify Garmazerstwo preservation, five stars, original icons and isolation
        run: python3 tools/verify_garmazerstwo.py
      - name: Verify optional ZenUI simplified food stat compatibility
        run: python3 tools/verify_zenui_compat.py
      - name: Compile net48 DLL
        run: dotnet build SirrohSkillsAddon.csproj -c Release -p:ReferenceDir="$GITHUB_WORKSPACE/.ci-deps" --nologo
      - name: Assemble Thunderstore package
        run: |
          mkdir -p dist/package
          cp bin/Release/net48/SirrohSkillsAddon.dll dist/package/
          cp README.md manifest.json dist/package/
          python3 tools/build_icon.py dist/package/icon.png
          python3 - <<'PY'
          import json,zipfile,pathlib
          m=json.loads(pathlib.Path('manifest.json').read_text())
          with zipfile.ZipFile(f'dist/{m["name"]}-{m["version_number"]}.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(pathlib.Path('dist/package').iterdir()): z.write(p,p.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Sirroh_Skills_Addon-v0.4.5
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish direct-download Thunderstore ZIP
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json;print(json.load(open("manifest.json"))["version_number"])')
          archive="dist/SirrohSkillsAddon-${version}.zip"
          test -s "$archive"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; preserving published artifact."
          else
            gh release create "$tag" "$archive" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Sirroh Skills [Addon] $tag — test build" \
              --notes "Kolos (Slayer), Zawadiaka (one-handed), Łowca Głów (trophies plus 10/5 kill thresholds). Optional Blacksmithing Expanded compatibility. Compiled and API-checked on Valheim 1.0; in-game multiplayer tests remain necessary."
          fi
